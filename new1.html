<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>城竞共生 - 王者荣耀电竞文旅交互平台</title>
    <!-- 高德地图API（替换为你的Key即可使用） -->
    <script type="text/javascript" src="https://webapi.amap.com/maps?v=2.0&key=e2a095f300f0f9872978f279979c899d"></script>
    <!-- ECharts可视化 -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <!-- 字体图标 -->
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* 王者荣耀主题配色变量 - 核心 */
        :root {
            --wz-gold: #F0B344;    /* 王者经典金-主色 */
            --wz-darkblue: #1A2B5F;/* 藏蓝-背景主色 */
            --wz-red: #E63946;     /* 王者红-点缀/强调 */
            --wz-light: #F8F9FA;   /* 浅白-文字 */
            --wz-gray: #6C757D;    /* 灰色-次要文字 */
            --wz-black: #0D1B2A;   /* 深黑-背景加深 */
            --wz-shadow: 0 0 20px rgba(240, 179, 68, 0.5); /* 金色光晕 */
            --wz-gradient: linear-gradient(135deg, var(--wz-gold) 0%, var(--wz-red) 100%); /* 金红渐变 */
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", "SimHei", sans-serif;
        }

        body {
            background: linear-gradient(180deg, var(--wz-darkblue) 0%, var(--wz-black) 100%);
            color: var(--wz-light);
            min-height: 100vh;
            padding-bottom: 50px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        /* 头部LOGO */
        header {
            text-align: center;
            padding: 30px 0;
            margin-bottom: 20px;
            border-bottom: 2px solid rgba(240, 179, 68, 0.3);
        }

        .logo {
            font-size: 3rem;
            font-weight: 700;
            background: var(--wz-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
            text-shadow: var(--wz-shadow);
        }

        .subtitle {
            font-size: 1.2rem;
            color: var(--wz-gold);
            letter-spacing: 2px;
        }

        /* 导航标签 */
        .nav-tabs {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .tab-btn {
            padding: 12px 35px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid transparent;
            border-radius: 50px;
            color: var(--wz-light);
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .tab-btn:hover {
            background: rgba(240, 179, 68, 0.2);
            transform: translateY(-2px);
        }

        .tab-btn.active {
            background: var(--wz-gold);
            color: var(--wz-darkblue);
            border-color: var(--wz-gold);
            box-shadow: var(--wz-shadow);
            font-weight: 600;
        }

        /* 标签内容容器 */
        .tab-content {
            display: none;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 20px;
            padding: 30px;
            border: 2px solid rgba(240, 179, 68, 0.2);
            backdrop-filter: blur(10px);
            animation: fadeIn 0.5s ease;
        }

        .tab-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 通用标题样式 */
        .content-title {
            color: var(--wz-gold);
            font-size: 1.8rem;
            margin-bottom: 25px;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        /* ============== 1. 电竞文旅交互地图（中国地图+精准城市点位） ============== */
        .map-container {
            width: 100%;
            height: 500px;
            border-radius: 15px;
            border: 2px solid var(--wz-gold);
            margin-bottom: 30px;
            overflow: hidden;
        }

        .route-generator {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 25px;
            border: 2px solid rgba(240, 179, 68, 0.3);
        }

        .input-group {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .input-field {
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid var(--wz-gold);
            border-radius: 10px;
            padding: 12px 15px;
            color: var(--wz-light);
            font-size: 1rem;
            outline: none;
        }

        .input-field::placeholder {
            color: var(--wz-gray);
        }

        .generate-btn {
            display: block;
            margin: 0 auto 20px;
            padding: 15px 40px;
            background: var(--wz-gradient);
            border: none;
            border-radius: 50px;
            color: var(--wz-light);
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .generate-btn:hover {
            transform: translateY(-3px);
            box-shadow: var(--wz-shadow);
        }

        .route-result {
            display: none;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            padding: 20px;
            border-left: 4px solid var(--wz-gold);
        }

        .route-result h4 {
            color: var(--wz-gold);
            margin-bottom: 15px;
        }

        .collect-route-btn {
            margin-top: 15px;
            padding: 8px 20px;
            background: rgba(240, 179, 68, 0.2);
            border: 2px solid var(--wz-gold);
            border-radius: 8px;
            color: var(--wz-gold);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .collect-route-btn:hover {
            background: var(--wz-gold);
            color: var(--wz-darkblue);
        }

        /* ============== 2. 沉浸式对话智能体（核心：介绍按钮+PPT式图片轮播） ============== */
        .character-categories {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .category-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 25px;
            text-align: center;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.3s ease;
        }

        .category-card:hover {
            transform: translateY(-5px);
            border-color: var(--wz-gold);
            background: rgba(240, 179, 68, 0.1);
        }

        .category-card.active {
            background: linear-gradient(135deg, rgba(240, 179, 68, 0.2), rgba(230, 57, 70, 0.2));
            border-color: var(--wz-gold);
            box-shadow: 0 0 15px rgba(240, 179, 68, 0.3);
        }

        .category-icon {
            font-size: 2.5rem;
            color: var(--wz-gold);
            margin-bottom: 10px;
        }

        .character-list {
            display: none;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .character-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.3s ease;
        }

        .character-card:hover {
            transform: scale(1.05);
            border-color: var(--wz-gold);
        }

        .character-card.active {
            background: rgba(240, 179, 68, 0.2);
            border-color: var(--wz-gold);
            box-shadow: var(--wz-shadow);
        }

        .character-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 10px;
            border: 3px solid var(--wz-gold);
        }

        .character-name {
            color: var(--wz-gold);
            font-weight: 600;
            margin-bottom: 5px;
        }

        .character-desc {
            font-size: 0.9rem;
            color: var(--wz-gray);
        }

        /* 对话核心区域 */
        .dialogue-area {
            display: none;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 25px;
            border: 2px solid var(--wz-gold);
        }

        /* 对话头部：人物信息+右上角功能按钮（介绍/图片放映-核心需求） */
        .dialogue-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 20px;
            border-bottom: 2px solid rgba(240, 179, 68, 0.3);
            margin-bottom: 20px;
        }

        .character-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .dialogue-avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: 3px solid var(--wz-gold);
            object-fit: cover;
        }

        .character-main-info h3 {
            color: var(--wz-gold);
            font-size: 1.3rem;
        }

        .character-main-info p {
            color: var(--wz-gray);
            font-size: 0.9rem;
        }

        /* 右上角功能按钮：介绍、图片放映（核心需求） */
        .dialogue-funcs {
            display: flex;
            gap: 10px;
        }

        .func-btn {
            padding: 8px 18px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid var(--wz-gold);
            border-radius: 8px;
            color: var(--wz-gold);
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .func-btn:hover {
            background: var(--wz-gold);
            color: var(--wz-darkblue);
            box-shadow: var(--wz-shadow);
        }

        /* 聊天内容区域 */
        .chat-container {
            height: 350px;
            overflow-y: auto;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .chat-container::-webkit-scrollbar {
            width: 6px;
        }

        .chat-container::-webkit-scrollbar-thumb {
            background: var(--wz-gold);
            border-radius: 3px;
        }

        .message {
            max-width: 80%;
            padding: 12px 18px;
            border-radius: 15px;
            margin-bottom: 15px;
            line-height: 1.5;
            animation: msgSlide 0.3s ease;
        }

        @keyframes msgSlide {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .character-msg {
            background: var(--wz-gradient);
            border-bottom-left-radius: 5px;
            margin-right: auto;
        }

        .user-msg {
            background: linear-gradient(135deg, #4361EE, #4CC9F0);
            border-bottom-right-radius: 5px;
            margin-left: auto;
        }

        /* 输入框 */
        .input-area {
            display: flex;
            gap: 10px;
        }

        .msg-input {
            flex: 1;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid var(--wz-gold);
            border-radius: 25px;
            padding: 12px 20px;
            color: var(--wz-light);
            outline: none;
            font-size: 1rem;
        }

        .send-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: var(--wz-gradient);
            border: none;
            color: var(--wz-light);
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .send-btn:hover {
            transform: scale(1.1);
            box-shadow: var(--wz-shadow);
        }

        /* ============== 3. 个人中心（登录注册/信息管理/路线收藏） ============== */
        .auth-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            margin-bottom: 30px;
        }

        .login-form, .register-form {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 25px;
            border: 2px solid var(--wz-gold);
        }

        .form-title {
            color: var(--wz-gold);
            font-size: 1.5rem;
            text-align: center;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            color: var(--wz-gold);
            margin-bottom: 8px;
            font-weight: 500;
        }

        .auth-btn {
            width: 100%;
            padding: 12px;
            background: var(--wz-gradient);
            border: none;
            border-radius: 8px;
            color: var(--wz-light);
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .auth-btn:hover {
            box-shadow: var(--wz-shadow);
        }

        /* 用户资料区域 */
        .user-profile {
            display: none;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 30px;
            border: 2px solid var(--wz-gold);
        }

        .profile-header {
            display: flex;
            align-items: center;
            gap: 20px;
            padding-bottom: 25px;
            border-bottom: 2px solid rgba(240, 179, 68, 0.3);
            margin-bottom: 25px;
            flex-wrap: wrap;
            justify-content: center;
            text-align: center;
        }

        .profile-avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid var(--wz-gold);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .profile-avatar:hover {
            transform: scale(1.05);
            box-shadow: var(--wz-shadow);
        }

        .profile-basic h3 {
            color: var(--wz-gold);
            font-size: 1.8rem;
            margin-bottom: 5px;
        }

        .profile-basic p {
            color: var(--wz-gray);
            margin-bottom: 15px;
        }

        .edit-profile-btn {
            padding: 8px 25px;
            background: rgba(240, 179, 68, 0.2);
            border: 2px solid var(--wz-gold);
            border-radius: 8px;
            color: var(--wz-gold);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .edit-profile-btn:hover {
            background: var(--wz-gold);
            color: var(--wz-darkblue);
        }

        /* 资料标签 */
        .profile-tabs {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .profile-tab-btn {
            padding: 10px 25px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid transparent;
            border-radius: 8px;
            color: var(--wz-light);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .profile-tab-btn.active {
            background: var(--wz-gold);
            color: var(--wz-darkblue);
            border-color: var(--wz-gold);
            font-weight: 600;
        }

        .profile-content {
            display: none;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 10px;
            padding: 20px;
        }

        .profile-content.active {
            display: block;
        }

        .profile-info-item {
            padding: 15px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .profile-info-item label {
            color: var(--wz-gold);
            font-weight: 600;
            display: block;
            margin-bottom: 5px;
        }

        .profile-info-item span {
            color: var(--wz-light);
            line-height: 1.5;
        }

        /* 收藏路线 */
        .collected-routes {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        .route-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            padding: 20px;
            border: 2px solid rgba(240, 179, 68, 0.3);
            transition: all 0.3s ease;
        }

        .route-card:hover {
            border-color: var(--wz-gold);
            transform: translateY(-5px);
        }

        .route-card-title {
            color: var(--wz-gold);
            font-size: 1.2rem;
            margin-bottom: 10px;
        }

        .route-card-desc {
            color: var(--wz-gray);
            font-size: 0.9rem;
            margin-bottom: 15px;
            line-height: 1.5;
        }

        .remove-route-btn {
            padding: 5px 15px;
            background: var(--wz-red);
            border: none;
            border-radius: 5px;
            color: var(--wz-light);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .remove-route-btn:hover {
            opacity: 0.8;
        }

        /* ============== 弹窗样式（人物介绍/PPT图片轮播/城市详情） ============== */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            z-index: 999;
            display: none;
        }

        .modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: var(--wz-darkblue);
            border-radius: 20px;
            border: 3px solid var(--wz-gold);
            z-index: 1000;
            display: none;
            padding: 30px;
            max-width: 90%;
            overflow-y: auto;
            max-height: 90vh;
        }

        .modal-close {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--wz-red);
            border: none;
            color: var(--wz-light);
            font-size: 1.2rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .modal-close:hover {
            transform: scale(1.1);
            box-shadow: 0 0 10px rgba(230, 57, 70, 0.8);
        }

        .modal-title {
            color: var(--wz-gold);
            font-size: 1.8rem;
            text-align: center;
            margin-bottom: 25px;
            padding-top: 10px;
        }

        /* 人物介绍弹窗 */
        .intro-modal {
            width: 700px;
        }

        .intro-content {
            line-height: 2;
            color: var(--wz-light);
        }

        .intro-content h4 {
            color: var(--wz-gold);
            margin: 20px 0 10px;
            font-size: 1.3rem;
        }

        /* 图片轮播弹窗（PPT式自动播放-核心需求） */
        .carousel-modal {
            width: 800px;
            padding: 20px;
        }

        .carousel-container {
            width: 100%;
            height: 500px;
            border-radius: 15px;
            overflow: hidden;
            border: 2px solid var(--wz-gold);
            margin-bottom: 20px;
            position: relative;
        }

        .carousel-slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 0.8s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .carousel-slide.active {
            opacity: 1;
        }

        .carousel-slide img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        /* 轮播指示器+控制按钮 */
        .carousel-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
        }

        .carousel-indicators {
            display: flex;
            gap: 10px;
        }

        .indicator-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .indicator-dot.active {
            background: var(--wz-gold);
            transform: scale(1.2);
            box-shadow: var(--wz-shadow);
        }

        .carousel-btn {
            padding: 8px 15px;
            background: var(--wz-gold);
            border: none;
            border-radius: 8px;
            color: var(--wz-darkblue);
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .carousel-btn:hover {
            box-shadow: var(--wz-shadow);
        }

        /* 城市详情弹窗 */
        .city-modal {
            width: 800px;
        }

        .city-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            flex-wrap: wrap;
        }

        .city-info-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            padding: 15px;
            border-left: 3px solid var(--wz-gold);
        }

        .city-info-card h4 {
            color: var(--wz-gold);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .city-info-card ul {
            list-style: none;
            line-height: 1.8;
            color: var(--wz-light);
        }

        .city-info-card li {
            margin-bottom: 5px;
        }

        /* ============== 响应式适配（移动端/平板/PC） ============== */
        @media (max-width: 768px) {
            .logo {
                font-size: 2rem;
            }
            .content-title {
                font-size: 1.5rem;
            }
            .dialogue-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }
            .carousel-container {
                height: 300px;
            }
            .intro-modal, .city-modal, .carousel-modal {
                width: 100%;
            }
            .city-content {
                grid-template-columns: 1fr;
            }
            .map-container {
                height: 350px;
            }
            .chat-container {
                height: 250px;
            }
        }

        @media (max-width: 480px) {
            .nav-tabs {
                gap: 10px;
            }
            .tab-btn {
                padding: 10px 20px;

        // 2.3 初始化人物列表
        function initCharacterList() {
            for (let cate in charData) {
                const listEl = document.getElementById(`${cate}List`);
                charData[cate].forEach(char => {
                    const card = document.createElement('div');
                    card.className = 'character-card';
                    card.onclick = () => selectCharacter(char);
                    card.innerHTML = `
                        <img src="${char.avatar}" alt="${char.name}" class="character-avatar">
                        <div class="character-name">${char.name}</div>
                        <div class="character-desc">${char.desc}</div>
                    `;
                    listEl.appendChild(card);
                });
            }
        }

        // 2.4 选择人物（打开对话窗口）
        function selectCharacter(char) {
            currentCharacter = char;
            // 清空聊天框默认内容
            const chatContainer = document.getElementById('chatContainer');
            chatContainer.innerHTML = `<div class="message character-msg">欢迎召唤师！我是${char.name}，有何指教？</div>`;
            // 填充人物信息
            document.getElementById('dialogueAvatar').src = char.avatar;
            document.getElementById('dialogueCharName').innerText = char.name;
            document.getElementById('dialogueCharDesc').innerText = char.desc;
            // 显示对话区域
            document.getElementById('dialogueArea').style.display = 'block';
            // 滚动到对话区域
            document.getElementById('dialogueArea').scrollIntoView({ behavior: 'smooth' });
            // 激活当前人物卡片
            document.querySelectorAll('.character-card').forEach(card => card.classList.remove('active'));
            event.target.closest('.character-card').classList.add('active');
        }

        // 2.5 发送聊天消息
        function sendMessage() {
            const input = document.getElementById('msgInput');
            const content = input.value.trim();
            if (!content || !currentCharacter) return;
            const chatContainer = document.getElementById('chatContainer');
            // 添加用户消息
            const userMsg = document.createElement('div');
            userMsg.className = 'message user-msg';
            userMsg.innerText = content;
            chatContainer.appendChild(userMsg);
            // 清空输入框
            input.value = '';
            // 模拟人物回复
            chatContainer.appendChild(document.createElement('div')).innerHTML = `<div class="message character-msg loading-dots">${currentCharacter.name}正在思考...</div>`;
            chatContainer.scrollTop = chatContainer.scrollHeight;
            // 随机延迟回复
            setTimeout(() => {
                const loading = document.querySelector('.loading-dots');
                if (loading) loading.remove();
                const charMsg = document.createElement('div');
                charMsg.className = 'message character-msg';
                // 随机回复语料
                const replies = [
                    `你说的${content}很有意思，召唤师的想法很独特！`,
                    `关于${content}，我有一些见解，不妨听听看～`,
                    `召唤师对${content}很关注嘛，看来是真爱粉了！`,
                    `${content}这个问题问得好，其实答案就藏在峡谷里～`
                ];
                charMsg.innerText = replies[Math.floor(Math.random() * replies.length)];
                chatContainer.appendChild(charMsg);
                chatContainer.scrollTop = chatContainer.scrollHeight;
            }, 1000 + Math.random() * 1000);
        }

        function showCharIntro() {
            if (!currentCharacter) return;
            document.getElementById('introModalTitle').innerText = `${currentCharacter.name} - 人物介绍`;
            document.getElementById('introModalContent').innerHTML = `
                <h4>人物简介</h4>

        // 2.7 显示图片轮播（PPT式自动播放-核心需求）
        function showCharCarousel() {
            if (!currentCharacter || !currentCharacter.images.length) return;
            const carouselContainer = document.getElementById('carouselContainer');
            const indicators = document.getElementById('carouselIndicators');
            // 清空原有内容
            carouselContainer.innerHTML = '';
            indicators.innerHTML = '';
            currentSlide = 0;
            // 生成轮播图
            currentCharacter.images.forEach((img, index) => {
                // 轮播项
                const slide = document.createElement('div');
                slide.className = `carousel-slide ${index === 0 ? 'active' : ''}`;
                slide.innerHTML = `<img src="${img}" alt="${currentCharacter.name}-${index+1}">`;
                carouselContainer.appendChild(slide);
                // 指示器
                const dot = document.createElement('div');
                dot.className = `indicator-dot ${index === 0 ? 'active' : ''}`;
                dot.onclick = () => switchSlide(index);
                indicators.appendChild(dot);
            });
            openModal('charCarouselModal');
            // 自动轮播（3秒/张）
            if (slideTimer) clearInterval(slideTimer);
            slideTimer = setInterval(nextSlide, 3000);
        }

        // 2.8 轮播图切换
        function switchSlide(index) {
            const slides = document.querySelectorAll('.carousel-slide');
            const dots = document.querySelectorAll('.indicator-dot');
            // 隐藏所有
            slides.forEach(s => s.classList.remove('active'));
            dots.forEach(d => d.classList.remove('active'));
            // 激活当前
            slides[index].classList.add('active');
            dots[index].classList.add('active');
            currentSlide = index;
        }

        // 上一张
        function prevSlide() {
            currentSlide = (currentSlide - 1 + document.querySelectorAll('.carousel-slide').length) % document.querySelectorAll('.carousel-slide').length;
            switchSlide(currentSlide);
        }

        // 下一张
        function nextSlide() {
            currentSlide = (currentSlide + 1) % document.querySelectorAll('.carousel-slide').length;
            switchSlide(currentSlide);
        }

        // 3.5 收藏文旅路线
        function collectRoute() {
            if (!isLogin) {
                alert('请先登录账号再收藏路线！');
                switchTab('userCenter');
                return;
            }
            const city = document.getElementById('travelCity').options[document.getElementById('travelCity').selectedIndex].text;
            const days = document.getElementById('travelDays').value;
            const routeTitle = `${city}${days}天电竞文旅路线`;
            const routeDesc = document.getElementById('routeContent').innerText;
            // 判重
            const isExisted = userData.collection.some(item => item.title === routeTitle);
            if (isExisted) {
                alert('该路线已收藏，无需重复收藏！');
                return;
            }
            // 添加收藏
            userData.collection.push({
                id: Date.now(),
                title: routeTitle,
                desc: routeDesc.substring(0, 100) + '...'
            });
            // 保存到本地存储
            saveLocalStorage();
            // 刷新收藏列表
            renderCollectionList();
            alert('路线收藏成功！可在个人中心-收藏路线中查看');
        }

            if (savedUser) {

                // 渲染用户信息
                renderUserInfo();
                // 渲染收藏列表
                renderCollectionList();
            }

        function saveLocalStorage() {
            localStorage.setItem('wzryUser', JSON.stringify(userData));
        }

        // 4.3 用户登录
        function userLogin() {
            const phone = document.getElementById('loginPhone').value.trim();
            const pwd = document.getElementById('loginPwd').value.trim();
            const savedUser = localStorage.getItem('wzryUser');
            if (!savedUser) {
                alert('该账号未注册，请先注册！');
                return;
            }
            const user = JSON.parse(savedUser);
            if (user.phone !== phone || user.pwd !== pwd) {
                alert('手机号或密码错误！');
                return;
            }
            isLogin = true;
            userData = user;
            renderUserInfo();
            renderCollectionList();
            alert('登录成功！');
        }

        // 4.4 用户注册
        function userRegister() {
            const username = document.getElementById('regUsername').value.trim();
            const phone = document.getElementById('regPhone').value.trim();
            const pwd = document.getElementById('regPwd').value.trim();
            const pwdConfirm = document.getElementById('regPwdConfirm').value.trim();
            // 验证
            if (!username || !phone || !pwd || !pwdConfirm) {
                alert('请填写完整的注册信息！');
                return;
            }
            if (!/^1[3-9]\d{9}$/.test(phone)) {
                alert('请输入正确的手机号！');
                return;
            }
            if (pwd.length < 6) {
                alert('密码长度不能少于6位！');
                return;
            }
            if (pwd !== pwdConfirm) {
                alert('两次输入的密码不一致！');
                return;
            }
            if (localStorage.getItem('wzryUser')) {
                alert('该手机号已注册，可直接登录！');
                return;
            }
            // 初始化用户数据
            userData = {
                username: username,
                phone: phone,
                pwd: pwd,
                avatar: 'https://game.gtimg.cn/images/yxzj/img201606/heroimg/168/168.jpg',
                intro: '暂无简介，点击编辑资料添加',
                regTime: new Date().toLocaleString(),
                collection: []
            };
            isLogin = true;
            // 保存到本地存储
            saveLocalStorage();
            // 渲染用户信息
            renderUserInfo();
            alert('注册成功！自动为您登录');
            // 清空注册表单
            document.getElementById('regUsername').value = '';
            document.getElementById('regPhone').value = '';
            document.getElementById('regPwd').value = '';
            document.getElementById('regPwdConfirm').value = '';
        }

        // 4.5 渲染用户信息
        function renderUserInfo() {
            if (!isLogin) return;
            document.getElementById('userProfile').style.display = 'block';
            document.getElementById('profileAvatar').src = userData.avatar;
            document.getElementById('profileUsername').innerText = userData.username;
            document.getElementById('profilePhone').innerText = userData.phone;
            document.getElementById('infoUsername').innerText = userData.username;
            document.getElementById('infoPhone').innerText = userData.phone;
            document.getElementById('infoIntro').innerText = userData.intro;
            document.getElementById('infoRegTime').innerText = userData.regTime;
        }

        // 4.6 切换个人中心标签
        function switchProfileTab(tab) {
            document.querySelectorAll('.profile-tab-btn').forEach(item => item.classList.remove('active'));
            document.querySelectorAll('.profile-content').forEach(item => item.classList.remove('active'));
            document.querySelector(`.profile-tab-btn[onclick="switchProfileTab('${tab}')"]`).classList.add('active');
            document.getElementById(`profile${tab.charAt(0).toUpperCase() + tab.slice(1)}`).classList.add('active');
        }

        // 4.7 渲染收藏路线列表
        function renderCollectionList() {
            const listEl = document.getElementById('collectedRoutesList');
            if (!isLogin || userData.collection.length === 0) {
                listEl.innerHTML = `
                    <div class="route-card">
                        <h4 class="route-card-title">暂无收藏路线</h4>
                        <p class="route-card-desc">快去生成并收藏你的专属电竞文旅路线吧！</p>
                    </div>
                `;
                return;
            }
            // 渲染收藏列表
            listEl.innerHTML = '';
            userData.collection.forEach(route => {
                const card = document.createElement('div');
                card.className = 'route-card';
                card.innerHTML = `
                    <h4 class="route-card-title">${route.title}</h4>
                    <p class="route-card-desc">${route.desc}</p>
                    <button class="remove-route-btn" onclick="removeCollection(${route.id})">
                        <i class="fas fa-trash"></i> 取消收藏
                    </button>
                `;
                listEl.appendChild(card);
            });
        }

        // 4.8 取消收藏路线
        function removeCollection(id) {
            if (confirm('确定要取消收藏该路线吗？')) {
                userData.collection = userData.collection.filter(item => item.id !== id);
                saveLocalStorage();
                renderCollectionList();
                alert('取消收藏成功！');
            }
        }

        // 4.9 更换头像
        function changeAvatar() {
            if (!isLogin) return;
            const avatarUrl = prompt('请输入头像图片URL（建议正方形）：', userData.avatar);
            if (avatarUrl && avatarUrl.trim()) {
                userData.avatar = avatarUrl.trim();
                saveLocalStorage();
                renderUserInfo();
                alert('头像更换成功！');
            }
        }

        // 4.10 编辑个人资料
        function editProfile() {
            if (!isLogin) return;
            const newUsername = prompt('请输入新的用户名：', userData.username);
            const newIntro = prompt('请输入个人简介：', userData.intro);
            if (newUsername && newUsername.trim()) {
                userData.username = newUsername.trim();
            }
            if (newIntro !== null) {
                userData.intro = newIntro.trim() || '暂无简介，点击编辑资料添加';
            }
            saveLocalStorage();
            renderUserInfo();
            alert('资料编辑成功！');
        }

        // ============== 页面销毁时清除定时器 ==============
        window.onunload = function() {
            if (slideTimer) clearInterval(slideTimer);
        };
    </script>
</body>
</html>
