<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文旅智能助手 Demo</title>
    <!-- 引入Tailwind CSS简化样式 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入图标库 -->
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <!-- 配置Tailwind自定义主题 -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#165DFF',
                        secondary: '#36CFC9',
                        dark: '#1D2129',
                        light: '#F2F3F5',
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .content-auto {
                content-visibility: auto;
            }
            .immersive-bg {
                background: linear-gradient(135deg, #165DFF 0%, #36CFC9 100%);
            }
            .chat-bubble-left {
                border-radius: 16px 16px 16px 4px;
            }
            .chat-bubble-right {
                border-radius: 16px 16px 4px 16px;
            }
            .nav-active {
                @apply text-primary border-b-2 border-primary;
            }
        }
    </style>
</head>
<body class="bg-light min-h-screen font-sans">
    <!-- 顶部导航栏 -->
    <header class="sticky top-0 z-50 bg-white shadow-sm">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <h1 class="text-xl font-bold text-primary">文旅智能助手</h1>
            <div class="flex items-center gap-3">
                <button id="voiceToggle" class="p-2 rounded-full hover:bg-light transition-colors">
                    <i class="fa fa-microphone text-lg text-dark"></i>
                </button>
                <a href="#profile" class="p-2 rounded-full hover:bg-light transition-colors">
                    <i class="fa fa-user text-lg text-dark"></i>
                </a>
            </div>
        </div>
        <!-- 底部导航（移动端） -->
        <nav class="md:hidden fixed bottom-0 left-0 right-0 bg-white shadow-md border-t">
            <div class="flex justify-around items-center py-2">
                <a href="#chat" class="nav-active py-2 px-4 text-center">
                    <i class="fa fa-comments block mx-auto"></i>
                    <span class="text-xs">对话</span>
                </a>
                <a href="#route" class="py-2 px-4 text-center text-gray-500">
                    <i class="fa fa-map-o block mx-auto"></i>
                    <span class="text-xs">路线</span>
                </a>
                <a href="#profile" class="py-2 px-4 text-center text-gray-500">
                    <i class="fa fa-user-o block mx-auto"></i>
                    <span class="text-xs">我的</span>
                </a>
            </div>
        </nav>
    </header>

    <main class="container mx-auto px-4 pb-20 md:pb-4 pt-4">
        <!-- 1. 沉浸式对话模块 -->
        <section id="chat" class="mb-8">
            <div class="bg-white rounded-2xl shadow-sm p-4 h-[60vh] flex flex-col">
                <h2 class="text-lg font-semibold mb-4 text-dark">智能对话</h2>
                <!-- 对话内容区域 -->
                <div id="chatContent" class="flex-1 overflow-y-auto mb-4 space-y-4">
                    <!-- 系统消息 -->
                    <div class="flex items-start gap-2">
                        <div class="w-8 h-8 rounded-full immersive-bg flex items-center justify-center text-white">
                            <i class="fa fa-robot"></i>
                        </div>
                        <div class="bg-light chat-bubble-left p-3 max-w-[80%]">
                            <p class="text-dark">你好！我是文旅智能助手，需要我为你生成文旅路线吗？</p>
                        </div>
                    </div>
                    <!-- 用户消息（示例） -->
                    <div class="flex items-start gap-2 justify-end">
                        <div class="bg-primary text-white chat-bubble-right p-3 max-w-[80%]">
                            <p>帮我生成一条3天的杭州文旅路线</p>
                        </div>
                        <div class="w-8 h-8 rounded-full bg-gray-200 flex items-center justify-center text-dark">
                            <i class="fa fa-user"></i>
                        </div>
                    </div>
                </div>
                <!-- 输入框 -->
                <div class="flex gap-2">
                    <input type="text" id="chatInput" placeholder="输入你的需求..." class="flex-1 px-4 py-2 rounded-full border border-gray-200 focus:outline-none focus:border-primary">
                    <button id="sendMsg" class="bg-primary text-white px-4 py-2 rounded-full hover:bg-primary/90 transition-colors">
                        <i class="fa fa-paper-plane"></i>
                    </button>
                    <button id="voiceInput" class="bg-light text-dark px-4 py-2 rounded-full hover:bg-gray-200 transition-colors">
                        <i class="fa fa-microphone"></i>
                    </button>
                </div>
            </div>
        </section>

        <!-- 2. 文旅路线生成模块 -->
        <section id="route" class="mb-8">
            <div class="bg-white rounded-2xl shadow-sm p-4">
                <h2 class="text-lg font-semibold mb-4 text-dark">文旅路线生成</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                    <div>
                        <label class="text-sm text-gray-600 mb-1 block">目的地</label>
                        <input type="text" placeholder="如：杭州、成都" class="w-full px-4 py-2 rounded-lg border border-gray-200 focus:outline-none focus:border-primary">
                    </div>
                    <div>
                        <label class="text-sm text-gray-600 mb-1 block">游玩天数</label>
                        <select class="w-full px-4 py-2 rounded-lg border border-gray-200 focus:outline-none focus:border-primary">
                            <option>1天</option>
                            <option>2天</option>
                            <option>3天</option>
                            <option>5天以上</option>
                        </select>
                    </div>
                </div>
                <button id="generateRoute" class="w-full bg-secondary text-white py-2 rounded-lg hover:bg-secondary/90 transition-colors">
                    生成定制路线
                </button>
                <!-- 路线展示区域 -->
                <div class="mt-4 border-t pt-4">
                    <div class="bg-light rounded-lg p-3 mb-2">
                        <h3 class="font-medium">杭州3天经典路线</h3>
                        <p class="text-sm text-gray-600 mt-1">Day1：西湖→雷峰塔→河坊街 | Day2：灵隐寺→龙井村 | Day3：西溪湿地→钱江新城</p>
                    </div>
                </div>
            </div>
        </section>

        <!-- 3. 语音切换模块 -->
        <section class="mb-8">
            <div class="bg-white rounded-2xl shadow-sm p-4">
                <h2 class="text-lg font-semibold mb-4 text-dark">语音设置</h2>
                <div class="space-y-4">
                    <div class="flex justify-between items-center">
                        <span>语音播报开关</span>
                        <label class="relative inline-flex items-center cursor-pointer">
                            <input type="checkbox" id="voiceSwitch" checked class="sr-only peer">
                            <div class="w-11 h-6 bg-gray-200 peer-focus:outline-none peer-focus:ring-2 peer-focus:ring-primary/20 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-primary"></div>
                        </label>
                    </div>
                    <div>
                        <label class="text-sm text-gray-600 mb-1 block">语音音色</label>
                        <select class="w-full px-4 py-2 rounded-lg border border-gray-200 focus:outline-none focus:border-primary">
                            <option>默认女声</option>
                            <option>温柔女声</option>
                            <option>沉稳男声</option>
                            <option>童声</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-sm text-gray-600 mb-1 block">语速</label>
                        <input type="range" min="0.5" max="2" step="0.1" value="1" class="w-full accent-primary" id="voiceSpeed">
                        <div class="flex justify-between text-xs text-gray-500">
                            <span>慢速</span>
                            <span id="speedValue">1.0x</span>
                            <span>快速</span>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- 4. 个人中心模块 -->
        <section id="profile">
            <div class="bg-white rounded-2xl shadow-sm p-4">
                <h2 class="text-lg font-semibold mb-4 text-dark">个人中心</h2>
                <!-- 用户信息 -->
                <div class="flex items-center gap-4 mb-6">
                    <div class="w-16 h-16 rounded-full immersive-bg flex items-center justify-center text-white text-2xl">
                        <i class="fa fa-user"></i>
                    </div>
                    <div>
                        <h3 class="font-medium text-lg">游客用户</h3>
                        <p class="text-sm text-gray-500">点击登录/注册</p>
                    </div>
                </div>
                <!-- 功能列表 -->
                <div class="space-y-2">
                    <a href="#" class="flex justify-between items-center py-3 px-2 hover:bg-light rounded-lg transition-colors">
                        <span class="flex items-center gap-2">
                            <i class="fa fa-star text-yellow-500"></i>
                            我的收藏
                        </span>
                        <i class="fa fa-chevron-right text-gray-400"></i>
                    </a>
                    <a href="#" class="flex justify-between items-center py-3 px-2 hover:bg-light rounded-lg transition-colors">
                        <span class="flex items-center gap-2">
                            <i class="fa fa-history text-gray-500"></i>
                            历史路线
                        </span>
                        <i class="fa fa-chevron-right text-gray-400"></i>
                    </a>
                    <a href="#" class="flex justify-between items-center py-3 px-2 hover:bg-light rounded-lg transition-colors">
                        <span class="flex items-center gap-2">
                            <i class="fa fa-cog text-gray-500"></i>
                            设置
                        </span>
                        <i class="fa fa-chevron-right text-gray-400"></i>
                    </a>
                </div>
            </div>
        </section>
    </main>

    <script>
        // 简单的交互逻辑实现
        document.addEventListener('DOMContentLoaded', function() {
            // 1. 对话发送功能
            const sendBtn = document.getElementById('sendMsg');
            const chatInput = document.getElementById('chatInput');
            const chatContent = document.getElementById('chatContent');

            sendBtn.addEventListener('click', function() {
                const msg = chatInput.value.trim();
                if (!msg) return;
                
                // 添加用户消息
                const userMsg = `
                    <div class="flex items-start gap-2 justify-end">
                        <div class="bg-primary text-white chat-bubble-right p-3 max-w-[80%]">
                            <p>${msg}</p>
                        </div>
                        <div class="w-8 h-8 rounded-full bg-gray-200 flex items-center justify-center text-dark">
                            <i class="fa fa-user"></i>
                        </div>
                    </div>
                `;
                chatContent.insertAdjacentHTML('beforeend', userMsg);
                chatInput.value = '';

                // 模拟机器人回复
                setTimeout(() => {
                    const robotMsg = `
                        <div class="flex items-start gap-2">
                            <div class="w-8 h-8 rounded-full immersive-bg flex items-center justify-center text-white">
                                <i class="fa fa-robot"></i>
                            </div>
                            <div class="bg-light chat-bubble-left p-3 max-w-[80%]">
                                <p>已收到你的需求，正在为你生成专属文旅路线...</p>
                            </div>
                        </div>
                    `;
                    chatContent.insertAdjacentHTML('beforeend', robotMsg);
                    // 滚动到底部
                    chatContent.scrollTop = chatContent.scrollHeight;
                }, 800);

                // 滚动到底部
                chatContent.scrollTop = chatContent.scrollHeight;
            });

            // 回车发送消息
            chatInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') sendBtn.click();
            });

            // 2. 语音语速调节
            const voiceSpeed = document.getElementById('voiceSpeed');
            const speedValue = document.getElementById('speedValue');
            voiceSpeed.addEventListener('input', function() {
                speedValue.textContent = `${this.value}x`;
            });

            // 3. 语音切换按钮
            const voiceToggle = document.getElementById('voiceToggle');
            voiceToggle.addEventListener('click', function() {
                const icon = this.querySelector('i');
                if (icon.classList.contains('fa-microphone')) {
                    icon.classList.replace('fa-microphone', 'fa-microphone-slash');
                    icon.style.color = '#ff4d4f';
                } else {
                    icon.classList.replace('fa-microphone-slash', 'fa-microphone');
                    icon.style.color = '#1D2129';
                }
            });

            // 4. 生成路线按钮
            const generateRoute = document.getElementById('generateRoute');
            generateRoute.addEventListener('click', function() {
                alert('路线生成中！demo仅展示前端效果，实际需对接后端接口');
            });
        });
    </script>
</body>
</html>
