<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>城竞共生 - 王者荣耀IP+AI智能体文旅交互平台</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <script src="https://unpkg.com/typewriter-effect@latest/dist/core.js"></script>
    <style>
        :root {
            --primary-color: #f0b344; /* 王者荣耀金色 */
            --secondary-color: #1a2b5f; /* 深蓝色 */
            --accent-color: #e63946; /* 红色点缀 */
            --light-color: #f8f9fa;
            --dark-color: #212529;
            --success-color: #2a9d8f;
            --hero-gradient: linear-gradient(135deg, #f0b344 0%, #e63946 100%);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #1a2b5f 0%, #0d1b2a 100%);
            color: #fff;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            border: 2px solid var(--primary-color);
        }

        .logo {
            font-size: 2.5rem;
            font-weight: bold;
            background: var(--hero-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(240, 179, 68, 0.3);
        }

        .subtitle {
            color: #f0b344;
            font-size: 1.2rem;
            margin-bottom: 10px;
        }

        .nav-tabs {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .tab-btn {
            padding: 12px 30px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid transparent;
            border-radius: 50px;
            color: #fff;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .tab-btn:hover {
            background: rgba(240, 179, 68, 0.2);
            transform: translateY(-2px);
        }

        .tab-btn.active {
            background: var(--primary-color);
            color: var(--secondary-color);
            border-color: var(--primary-color);
            box-shadow: 0 0 20px rgba(240, 179, 68, 0.5);
        }

        .tab-content {
            display: none;
            animation: fadeIn 0.5s ease;
        }

        .tab-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 文旅界面样式 */
        .travel-interface {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 30px;
            backdrop-filter: blur(10px);
            border: 2px solid rgba(240, 179, 68, 0.3);
        }

        .map-container {
            height: 500px;
            background: rgba(26, 43, 95, 0.8);
            border-radius: 15px;
            margin-bottom: 30px;
            position: relative;
            overflow: hidden;
            border: 2px solid var(--primary-color);
        }

        .city-marker {
            position: absolute;
            width: 20px;
            height: 20px;
            background: var(--accent-color);
            border-radius: 50%;
            cursor: pointer;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 15px var(--accent-color);
            transition: all 0.3s ease;
            animation: pulse 2s infinite;
        }

        .city-marker:hover {
            width: 30px;
            height: 30px;
            box-shadow: 0 0 25px var(--accent-color);
        }

        .city-name {
            position: absolute;
            background: rgba(0, 0, 0, 0.8);
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 12px;
            white-space: nowrap;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .city-marker:hover .city-name {
            opacity: 1;
        }

        @keyframes pulse {
            0% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -50%) scale(1.1); }
            100% { transform: translate(-50%, -50%) scale(1); }
        }

        .city-detail-modal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            max-width: 800px;
            max-height: 80vh;
            overflow-y: auto;
            background: linear-gradient(135deg, #1a2b5f 0%, #0d1b2a 100%);
            border-radius: 20px;
            padding: 30px;
            z-index: 1000;
            border: 3px solid var(--primary-color);
            box-shadow: 0 0 50px rgba(240, 179, 68, 0.5);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid var(--primary-color);
        }

        .modal-close {
            background: var(--accent-color);
            border: none;
            color: white;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .city-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }

        .info-section {
            background: rgba(255, 255, 255, 0.05);
            padding: 20px;
            border-radius: 15px;
            border-left: 4px solid var(--primary-color);
        }

        .info-section h3 {
            color: var(--primary-color);
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .info-section h3 i {
            font-size: 1.2em;
        }

        .player-card, .hero-card {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 10px;
            border: 1px solid rgba(240, 179, 68, 0.3);
        }

        .task-card {
            background: linear-gradient(135deg, rgba(240, 179, 68, 0.1) 0%, rgba(230, 57, 70, 0.1) 100%);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 10px;
            border: 1px solid var(--primary-color);
        }

        .task-card .task-reward {
            display: inline-block;
            background: var(--success-color);
            padding: 3px 8px;
            border-radius: 5px;
            font-size: 0.9em;
            margin-left: 10px;
        }

        .ai-interaction {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 25px;
            border: 2px solid rgba(42, 157, 143, 0.3);
        }

        .input-group {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .input-field {
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid var(--primary-color);
            border-radius: 10px;
            padding: 12px 15px;
            color: white;
            font-size: 1rem;
        }

        .input-field:focus {
            outline: none;
            box-shadow: 0 0 10px rgba(240, 179, 68, 0.5);
        }

        .generate-btn {
            background: var(--hero-gradient);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 50px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: block;
            margin: 20px auto;
        }

        .generate-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 25px rgba(240, 179, 68, 0.7);
        }

        .route-result {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 20px;
            margin-top: 20px;
            border: 2px solid rgba(42, 157, 143, 0.3);
            display: none;
        }

        /* 对话界面样式 */
        .dialogue-interface {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 30px;
            backdrop-filter: blur(10px);
            border: 2px solid rgba(240, 179, 68, 0.3);
        }

        .character-selection {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .category-card {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }

        .category-card:hover {
            background: rgba(240, 179, 68, 0.2);
            transform: translateY(-5px);
            border-color: var(--primary-color);
        }

        .category-card.active {
            background: linear-gradient(135deg, rgba(240, 179, 68, 0.3) 0%, rgba(230, 57, 70, 0.3) 100%);
            border-color: var(--primary-color);
            box-shadow: 0 0 20px rgba(240, 179, 68, 0.4);
        }

        .category-icon {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: var(--primary-color);
        }

        .character-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
            display: none;
        }

        .character-card {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }

        .character-card:hover {
            background: rgba(240, 179, 68, 0.2);
            transform: scale(1.05);
            border-color: var(--primary-color);
        }

        .character-card.active {
            background: linear-gradient(135deg, rgba(240, 179, 68, 0.3) 0%, rgba(230, 57, 70, 0.3) 100%);
            border-color: var(--primary-color);
            box-shadow: 0 0 15px rgba(240, 179, 68, 0.4);
        }

        .character-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 10px;
            border: 3px solid var(--primary-color);
        }

        .character-name {
            font-weight: bold;
            color: var(--primary-color);
        }

        .dialogue-area {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 25px;
            border: 2px solid var(--primary-color);
            margin-top: 20px;
            display: none;
        }

        .chat-container {
            height: 300px;
            overflow-y: auto;
            margin-bottom: 20px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
        }

        .message {
            margin-bottom: 15px;
            padding: 12px 15px;
            border-radius: 15px;
            max-width: 80%;
            animation: messageSlide 0.3s ease;
        }

        @keyframes messageSlide {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .user-message {
            background: linear-gradient(135deg, #4cc9f0 0%, #4361ee 100%);
            margin-left: auto;
            text-align: right;
            border-bottom-right-radius: 5px;
        }

        .character-message {
            background: linear-gradient(135deg, #f0b344 0%, #f8961e 100%);
            margin-right: auto;
            border-bottom-left-radius: 5px;
        }

        .input-area {
            display: flex;
            gap: 10px;
        }

        .message-input {
            flex: 1;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid var(--primary-color);
            border-radius: 25px;
            padding: 12px 20px;
            color: white;
            font-size: 1rem;
        }

        .send-btn {
            background: var(--hero-gradient);
            border: none;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            cursor: pointer;
            color: white;
            font-size: 1.2rem;
            transition: all 0.3s ease;
        }

        .send-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 0 15px rgba(240, 179, 68, 0.7);
        }

        .loading-dots {
            display: inline-block;
        }

        .loading-dots::after {
            content: '...';
            animation: dots 1.5s steps(4, end) infinite;
        }

        @keyframes dots {
            0%, 20% { content: ''; }
            40% { content: '.'; }
            60% { content: '..'; }
            80%, 100% { content: '...'; }
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .nav-tabs {
                flex-direction: column;
                align-items: center;
            }
            
            .tab-btn {
                width: 100%;
                max-width: 300px;
            }
            
            .city-content {
                grid-template-columns: 1fr;
            }
            
            .character-selection {
                grid-template-columns: 1fr;
            }
            
            .input-group {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">城竞共生</div>
            <div class="subtitle">王者荣耀IP+AI智能体文旅交互平台</div>
            <p>电竞AI应用创新与实践 · 智慧电竞文旅融合</p>
        </header>

        <div class="nav-tabs">
            <button class="tab-btn active" onclick="switchTab('travel')">文旅交互智能体</button>
            <button class="tab-btn" onclick="switchTab('dialogue')">沉浸式对话智能体</button>
        </div>

        <!-- 文旅交互智能体界面 -->
        <div id="travel" class="tab-content active">
            <div class="travel-interface">
                <h2 style="color: var(--primary-color); margin-bottom: 20px; text-align: center;">
                    <i>📍</i> 电竞文旅地图交互
                </h2>
                
                <div class="map-container" id="chinaMap">
                    <!-- 城市标记点通过JavaScript动态生成 -->
                    <div class="city-marker" style="top: 30%; left: 45%;" onclick="showCityDetail('xian')">
                        <div class="city-name">西安</div>
                    </div>
                    <div class="city-marker" style="top: 35%; left: 55%;" onclick="showCityDetail('chengdu')">
                        <div class="city-name">成都</div>
                    </div>
                    <div class="city-marker" style="top: 40%; left: 65%;" onclick="showCityDetail('shanghai')">
                        <div class="city-name">上海</div>
                    </div>
                    <div class="city-marker" style="top: 50%; left: 50%;" onclick="showCityDetail('wuhan')">
                        <div class="city-name">武汉</div>
                    </div>
                    <div class="city-marker" style="top: 60%; left: 45%;" onclick="showCityDetail('guangzhou')">
                        <div class="city-name">广州</div>
                    </div>
                    <div class="city-marker" style="top: 50%; left: 70%;" onclick="showCityDetail('hangzhou')">
                        <div class="city-name">杭州</div>
                    </div>
                </div>

                <!-- AI交互区域 -->
                <div class="ai-interaction">
                    <h3 style="color: var(--primary-color); margin-bottom: 20px;">
                        <i>🤖</i> AI智能体路线规划
                    </h3>
                    
                    <div class="input-group">
                        <select class="input-field" id="travelCity">
                            <option value="">选择旅行城市</option>
                            <option value="xian">西安</option>
                            <option value="chengdu">成都</option>
                            <option value="shanghai">上海</option>
                            <option value="wuhan">武汉</option>
                            <option value="guangzhou">广州</option>
                            <option value="hangzhou">杭州</option>
                        </select>
                        
                        <select class="input-field" id="travelDays">
                            <option value="">出行天数</option>
                            <option value="1">1天</option>
                            <option value="2">2天</option>
                            <option value="3">3天</option>
                            <option value="4">4天以上</option>
                        </select>
                        
                        <select class="input-field" id="travelPeople">
                            <option value="">同行人数</option>
                            <option value="1">1人</option>
                            <option value="2">2人</option>
                            <option value="3-5">3-5人</option>
                            <option value="5+">5人以上</option>
                        </select>
                        
                        <select class="input-field" id="travelRelationship">
                            <option value="">人物关系</option>
                            <option value="friends">好友同行</option>
                            <option value="family">家庭出游</option>
                            <option value="couple">情侣出行</option>
                            <option value="team">团队出行</option>
                        </select>
                        
                        <select class="input-field" id="favoriteHero">
                            <option value="">本命英雄</option>
                            <option value="libai">李白</option>
                            <option value="yao">瑶</option>
                            <option value="yao2">曜</option>
                            <option value="daqiao">大乔</option>
                            <option value="others">其他</option>
                        </select>
                        
                        <select class="input-field" id="favoritePlayer">
                            <option value="">喜爱选手</option>
                            <option value="fly">Fly（彭云飞）</option>
                            <option value="cat">Cat（陈正正）</option>
                            <option value="yagao">Yagao（曾奇）</option>
                            <option value="others">其他</option>
                        </select>
                    </div>
                    
                    <button class="generate-btn" onclick="generateRoute()">
                        <i>🚀</i> 生成专属电竞文旅路线
                    </button>
                    
                    <div id="routeResult" class="route-result">
                        <h4 style="color: var(--primary-color); margin-bottom: 15px;">您的专属电竞文旅路线建议：</h4>
                        <div id="routeContent"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 沉浸式对话智能体界面 -->
        <div id="dialogue" class="tab-content">
            <div class="dialogue-interface">
                <h2 style="color: var(--primary-color); margin-bottom: 20px; text-align: center;">
                    <i>💬</i> 沉浸式电竞IP对话体验
                </h2>
                
                <div class="character-selection">
                    <div class="category-card active" onclick="selectCategory('hero')">
                        <div class="category-icon">⚔️</div>
                        <h3>游戏英雄</h3>
                        <p>与王者荣耀英雄对话</p>
                    </div>
                    
                    <div class="category-card" onclick="selectCategory('player')">
                        <div class="category-icon">🎮</div>
                        <h3>电竞选手</h3>
                        <p>与KPL职业选手交流</p>
                    </div>
                    
                    <div class="category-card" onclick="selectCategory('celebrity')">
                        <div class="category-icon">🌟</div>
                        <h3>电竞达人</h3>
                        <p>与电竞明星/博主互动</p>
                    </div>
                </div>
                
                <div id="heroList" class="character-list">
                    <!-- 英雄角色通过JavaScript动态生成 -->
                </div>
                
                <div id="playerList" class="character-list">
                    <!-- 选手通过JavaScript动态生成 -->
                </div>
                
                <div id="celebrityList" class="character-list">
                    <!-- 达人通过JavaScript动态生成 -->
                </div>
                
                <div id="dialogueArea" class="dialogue-area">
                    <div class="dialogue-header" style="display: flex; align-items: center; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 2px solid var(--primary-color);">
                        <img id="currentCharacterAvatar" src="" alt="角色头像" class="character-avatar" style="margin-right: 15px; width: 60px; height: 60px;">
                        <div>
                            <h3 id="currentCharacterName" style="color: var(--primary-color); margin-bottom: 5px;"></h3>
                            <p id="currentCharacterDesc" style="font-size: 0.9em; opacity: 0.8;"></p>
                        </div>
                    </div>
                    
                    <div class="chat-container" id="chatContainer">
                        <div class="message character-message" id="welcomeMessage">
                            欢迎召唤师！本将在此，有何指教？
                        </div>
                    </div>
                    
                    <div class="input-area">
                        <input type="text" class="message-input" id="messageInput" placeholder="输入你想说的话..." onkeypress="handleKeyPress(event)">
                        <button class="send-btn" onclick="sendMessage()">
                            <i>📤</i>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 城市详情弹窗 -->
    <div id="cityDetailModal" class="city-detail-modal">
        <div class="modal-header">
            <h2 id="cityTitle" style="color: var(--primary-color);"></h2>
            <button class="modal-close" onclick="closeCityDetail()">×</button>
        </div>
        <div class="city-content" id="cityContent">
            <!-- 内容通过JavaScript动态生成 -->
        </div>
    </div>

    <script>
        // 切换标签页
        function switchTab(tabName) {
            // 更新按钮状态
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            
            // 更新内容显示
            document.querySelectorAll('.tab-content').forEach(content => {
                content.classList.remove('active');
            });
            document.getElementById(tabName).classList.add('active');
            
            // 如果是对话界面，默认显示英雄列表
            if (tabName === 'dialogue') {
                selectCategory('hero');
            }
        }

        // 城市数据
        const cityData = {
            xian: {
                name: "西安 · 长安荣耀之旅",
                players: [
                    { name: "一诺（徐必成）", hero: "公孙离", team: "成都AG超玩会", desc: "KPL顶级发育路选手，以极限操作闻名" },
                    { name: "Fly（彭云飞）", hero: "花木兰", team: "重庆狼队", desc: "六冠王边路，KPL传奇选手" }
                ],
                heroes: [
                    { name: "李白", role: "刺客", style: "诗意剑客", desc: "长安城中的诗仙剑客，豪放不羁" },
                    { name: "武则天", role: "法师", style: "女帝风范", desc: "大唐女帝，掌控全局的女王" }
                ],
                eSportsInfo: [
                    "🏆 KPL职业联赛西部赛区重要主场城市",
                    "🎮 多次举办王者荣耀城市赛全国总决赛",
                    "🌟 西安WE战队主场，拥有专业电竞场馆",
                    "🎪 大唐不夜城电竞主题灯光秀常驻活动"

        // 选择角色类别
        function selectCategory(category) {
            // 更新类别卡片状态
            document.querySelectorAll('.category-card').forEach(card => {
                card.classList.remove('active');
            });
            event.target.closest('.category-card').classList.add('active');
            
            // 隐藏所有角色列表
            document.querySelectorAll('.character-list').forEach(list => {
                list.style.display = 'none';
            });
            
            // 显示对应角色列表
            document.getElementById(category + 'List').style.display = 'grid';
            
            // 清空当前对话
            document.getElementById('dialogueArea').style.display = 'none';
            document.getElementById('chatContainer').innerHTML = '<div class="message character-message" id="welcomeMessage">欢迎召唤师！请选择一位角色开始对话~</div>';
            
            // 生成角色卡片
            const listElement = document.getElementById(category + 'List');
            const characters = characterData[category];
            
            listElement.innerHTML = characters.map(char => `
                <div class="character-card" onclick="selectCharacter('${category}', '${char.id}')">
                    <img src="${char.avatar}" alt="${char.name}" class="character-avatar">
                    <div class="character-name">${char.name}</div>
                    <div style="font-size: 0.8em; opacity: 0.8;">${char.style}</div>
                </div>
            `).join('');
        }

        // 选择具体角色
        function selectCharacter(category, charId) {
            const characters = characterData[category];
            const character = characters.find(c => c.id === charId);
            
            if (!character) return;
            
            // 更新角色卡片状态
            document.querySelectorAll('.character-card').forEach(card => {
                card.classList.remove('active');
            });
            event.target.closest('.character-card').classList.add('active');
            
            // 更新对话区域显示
            document.getElementById('currentCharacterAvatar').src = character.avatar;
            document.getElementById('currentCharacterName').textContent = character.name;
            document.getElementById('currentCharacterDesc').textContent = character.desc + ' · ' + character.style;
            document.getElementById('dialogueArea').style.display = 'block';
            
            // 清空聊天记录，显示欢迎语
            const chatContainer = document.getElementById('chatContainer');
            chatContainer.innerHTML = `
                <div class="message character-message">
                    欢迎召唤师！${getWelcomeMessage(charId)}
                </div>
            `;
            
            // 滚动到底部
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // 发送消息
        function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            
            if (!message) return;
            
            const chatContainer = document.getElementById('chatContainer');
            const currentCharacter = document.getElementById('currentCharacterName').textContent;
            
            // 添加用户消息
            const userMessage = document.createElement('div');
            userMessage.className = 'message user-message';
            userMessage.textContent = message;
            chatContainer.appendChild(userMessage);
            
            // 清空输入框
            input.value = '';
            
            // 添加AI回复（模拟）
            setTimeout(() => {
                const characterId = getCurrentCharacterId();
                const aiMessage = document.createElement('div');
                aiMessage.className = 'message character-message';
                aiMessage.innerHTML = `<span class="loading-dots"></span>`;
                
                chatContainer.appendChild(aiMessage);
                chatContainer.scrollTop = chatContainer.scrollHeight;
                
                // 模拟AI思考时间
                setTimeout(() => {
                    const responses = dialogueResponses[characterId] || [
                        "这个问题很有趣，让我想想...",
                        "作为" + currentCharacter + "，我觉得...",
                        "哈哈，你这个问题问得好！",
                        "在电竞的世界里，这个问题的答案是...",
                        "让我用我的经验来回答你..."
                    ];
                    
                    const randomResponse = responses[Math.floor(Math.random() * responses.length)];
                    
                    // 使用打字机效果
                    aiMessage.innerHTML = '';
                    const typewriter = new Typewriter(aiMessage, {
                        delay: 20,
                        cursor: ''
                    });
                    
                    typewriter.typeString(randomResponse)
                        .start();
                        
                    chatContainer.scrollTop = chatContainer.scrollHeight;
                }, 1000);
            }, 500);
            
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // 获取当前角色ID
        function getCurrentCharacterId() {
            const name = document.getElementById('currentCharacterName').textContent.toLowerCase();
            const characters = [...characterData.hero, ...characterData.player, ...characterData.celebrity];
            const char = characters.find(c => c.name.toLowerCase() === name);
            return char ? char.id : 'libai';
        }

        // 回车发送消息
        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }
